# Real test of step E2 ("engine for real" note §2) — can be rerun.
#   ansible-playbook verify-engine-forge.yml
# The ENGINE'S CODE (orchestrator/src/external/gitea-forge.ts, run by
# orchestrator/scripts/trial-forge.ts) creates a tool on the real forge, from
# the orchestrator VM, through https://<gitea_domain> and the token of
# svc-orchestrator. Then the admin checks the real effect, and everything is
# cleaned up (trial repositories, token, files), even if a check fails.
#
# The engine in service is not touched (one engine at a time, D23): the
# adapter runs alone, in a throwaway Node container (same base image as the
# engine, by digest), without database or DBOS; it only needs its two files,
# copied here.
#
# Prerequisites:
#   - the orchestrator VM trusts the forge and finds it (role lab_ca: lab
#     authority and /etc/hosts);
#   - svc-orchestrator is a member of the agents team: otherwise Gitea 28
#     refuses to let it assign a repository to that team (reqTeamMembership,
#     403 "Must be a team member"). It gains no right from it: the agents team
#     only writes code and PRs, on the repositories assigned to it;
#   - the organisation lets a repository admin change its teams
#     (repo_admin_change_team_access): otherwise only an owner of the
#     organisation can (CanDoerManageOrgRepoCollaboratorTeam, 403 "Must have
#     permission to manage team repository access"). The robot is admin of a
#     tool only while it creates it.
#
# Expected:
#   - tool generated by the engine: private, same protections as
#     gitea_branch_protections, assigned to the agents team;
#   - svc-orchestrator is no longer a collaborator; it can no longer change
#     the protections (403) but still pushes to main (its team);
#   - creation run again: no effect, same final state (idempotence);
#   - hard stop simulated between the generation and the removal (repository
#     generated by the token, nothing else): the creation run again finishes the job;
#   - repository of the same name created by a human: refused, nothing changed.
- name: E2 — the engine creates a tool on the real forge
  hosts: forge
  become: true
  vars:
    slug: check-engine-e2
    resumed_slug: check-engine-e2-resumed
    human_slug: check-engine-e2-human
    token_name: "check-engine-e2-{{ ansible_date_time.epoch }}"
    orchestrator: "{{ groups['orchestrator'][0] }}"
    # Directory in memory (tmpfs /run) on the orchestrator VM.
    trial_dir: /run/eupadev-check-e2
    trial_src: "{{ playbook_dir }}/../../orchestrator"
    # Same base as the engine image (orchestrator/Dockerfile).
    trial_image: node:22.23.4-trixie-slim@sha256:8eb619e402eaede1748a3c8173bffab391592812e85136452f781741c7242ddf
    lab_ca_crt: /usr/local/share/ca-certificates/eupadev-lab.crt
    workdir: /tmp/check-engine-e2
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ gitea_admin_user }}"
      url_password: "{{ vault_gitea_admin_password }}"
      force_basic_auth: true
      body_format: json
      return_content: true
  tasks:
    - name: Checks
      block:
        # An earlier trial that was interrupted must not skew anything.
        - name: Delete the trial repositories of an earlier run
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ item }}"
            method: DELETE
            status_code: [204, 404]
          loop: ["{{ slug }}", "{{ resumed_slug }}", "{{ human_slug }}"]

        - name: Read the teams of the organisation
          ansible.builtin.uri:
            url: "{{ gitea_api }}/orgs/{{ gitea_org }}/teams?limit=50"
          register: teams

        - name: Keep the agents team
          ansible.builtin.set_fact:
            agents_team: "{{ (teams.json | selectattr('name', 'equalto', 'agents') | first).id }}"

        - name: Is the robot svc-orchestrator a member of the agents team?
          ansible.builtin.uri:
            url: "{{ gitea_api }}/teams/{{ agents_team }}/members/svc-orchestrator"
            status_code: [200, 404]
          register: agents_member

        - name: Prerequisite — svc-orchestrator member of the agents team
          ansible.builtin.assert:
            that: agents_member.status == 200
            success_msg: "OK — svc-orchestrator is a member of the agents team"
            fail_msg: >-
              MISSING PREREQUISITE — svc-orchestrator is not a member of the agents team:
              Gitea 28 will refuse to let it assign the tool (403 "Must be a team member").
              Add it in the gitea_org role, then run again.
            quiet: true

        - name: Read the settings of the organisation
          ansible.builtin.uri:
            url: "{{ gitea_api }}/orgs/{{ gitea_org }}"
          register: organisation

        - name: Prerequisite — a repository admin can change the teams of the repository
          ansible.builtin.assert:
            that: organisation.json.repo_admin_change_team_access
            success_msg: "OK — repo_admin_change_team_access on for {{ gitea_org }}"
            fail_msg: >-
              MISSING PREREQUISITE — repo_admin_change_team_access is false for {{ gitea_org }}:
              Gitea 28 will refuse svc-orchestrator, admin of the tool only, to assign it to the agents team.
              Turn it on in the gitea_org role (PATCH /orgs/{{ gitea_org }}), then run again.
            quiet: true

        - name: The orchestrator VM finds the forge
          ansible.builtin.command:
            argv: [getent, hosts, "{{ gitea_domain }}"]
          delegate_to: "{{ orchestrator }}"
          changed_when: false

        - name: Is the lab authority on the orchestrator VM?
          ansible.builtin.stat:
            path: "{{ lab_ca_crt }}"
          delegate_to: "{{ orchestrator }}"
          register: lab_ca

        - name: Prerequisite — the orchestrator VM trusts the forge (lab)
          ansible.builtin.assert:
            that: caddy_tls != 'internal' or lab_ca.stat.exists
            fail_msg: "MISSING PREREQUISITE — role lab_ca missing on the orchestrator VM ({{ lab_ca_crt }})"
            quiet: true

        - name: Temporary token of svc-orchestrator (same scopes as the engine)
          ansible.builtin.uri:
            url: "{{ gitea_api }}/users/svc-orchestrator/tokens"
            method: POST
            body: { name: "{{ token_name }}", scopes: [write:repository, write:organization] }
            status_code: 201
          register: token
          no_log: true

        - name: Trial directories (memory, orchestrator VM)
          ansible.builtin.file:
            path: "{{ trial_dir }}/{{ item }}"
            state: directory
            owner: "1000"
            mode: "0700"
          loop: ["", src/external, scripts]
          delegate_to: "{{ orchestrator }}"

        # Only the token is secret: 0400, owner = the node user of the container.
        - name: Write the token (read through FORGE_TOKEN_FILE)
          ansible.builtin.copy:
            dest: "{{ trial_dir }}/token"
            content: "{{ token.json.sha1 }}\n"
            owner: "1000"
            mode: "0400"
          delegate_to: "{{ orchestrator }}"
          no_log: true

        - name: Copy the forge adapter and the trial script
          ansible.builtin.copy:
            src: "{{ trial_src }}/{{ item }}"
            dest: "{{ trial_dir }}/{{ item }}"
            owner: "1000"
            mode: "0400"
          loop: [src/external/contracts.ts, src/external/gitea-forge.ts, scripts/trial-forge.ts]
          delegate_to: "{{ orchestrator }}"

        - name: Module file (ESM)
          ansible.builtin.copy:
            dest: "{{ trial_dir }}/package.json"
            content: '{"type": "module"}'
            owner: "1000"
            mode: "0400"
          delegate_to: "{{ orchestrator }}"

        # Host network: /etc/hosts of the VM (lab_ca); read-only container,
        # without privilege. The token is never passed as an argument.
        - name: The engine creates the tool, then runs the creation again (idempotence)
          ansible.builtin.command:
            argv: >-
              {{ ['docker', 'run', '--rm', '--network', 'host', '--read-only', '--cap-drop', 'ALL',
                  '--security-opt', 'no-new-privileges:true', '--user', '1000',
                  '-v', trial_dir ~ ':/trial:ro',
                  '-e', 'FORGE_URL=https://' ~ gitea_domain, '-e', 'FORGE_TOKEN_FILE=/trial/token']
                 + (['-v', lab_ca_crt ~ ':/lab-ca.crt:ro', '-e', 'NODE_EXTRA_CA_CERTS=/lab-ca.crt'] if lab_ca.stat.exists else [])
                 + [trial_image, 'node', '/trial/scripts/trial-forge.ts', 'create', item] }}
          loop: ["{{ slug }}", "{{ slug }}"]
          delegate_to: "{{ orchestrator }}"
          register: creations
          changed_when: true
          failed_when: false

        - name: Both creations succeed, final state checked by the engine
          ansible.builtin.assert:
            that: item.rc == 0
            success_msg: "OK — {{ item.stdout }}"
            fail_msg: "FAILED — creation by the engine: {{ item.stderr }}"
            quiet: true
          loop: "{{ creations.results }}"
          loop_control: { label: "{{ item.item }}" }

        - name: Read the created tool, its collaborator and its team (admin)
          ansible.builtin.uri:
            url: "{{ gitea_api }}{{ item.path }}"
            status_code: [200, 204, 404]
          loop:
            - { what: repo, path: "/repos/{{ gitea_org }}/{{ slug }}" }
            - { what: collaborator, path: "/repos/{{ gitea_org }}/{{ slug }}/collaborators/svc-orchestrator" }
            - { what: team, path: "/teams/{{ agents_team }}/repos/{{ gitea_org }}/{{ slug }}" }
          loop_control: { label: "{{ item.what }}" }
          register: read_back

        - name: Private, assigned to the agents team, svc-orchestrator no longer a collaborator
          ansible.builtin.assert:
            that:
              - read_back.results[0].json.private
              - not read_back.results[0].json.archived
              - read_back.results[1].status == 404
              - read_back.results[2].status == 200
            success_msg: "OK — private tool, agents team, svc-orchestrator is no longer a collaborator"
            fail_msg: >-
              FAILED — private {{ read_back.results[0].json.private }}, collaborator {{ read_back.results[1].status }} (404 expected),
              team {{ read_back.results[2].status }} (200 expected)
            quiet: true

        - name: Read the protections of the created tool
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ slug }}/branch_protections"
          register: protections

        - name: The tool has exactly the protections of gitea_branch_protections
          vars:
            actual: "{{ protections.json | selectattr('rule_name', 'equalto', item.rule_name) | first | default({}) }}"
            # Same comparison as verify-forge.yml (lists without order).
            differences: >-
              {%- set ns = namespace(e=[]) -%}
              {%- for k, v in item.items() -%}
              {%- set a = actual[k] | default(none) -%}
              {%- if v is sequence and v is not string -%}{%- set a = (a or []) | sort -%}{%- set v = v | sort -%}{%- endif -%}
              {%- if a != v -%}{%- set ns.e = ns.e + [k] -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.e }}
          ansible.builtin.assert:
            that: differences | length == 0
            success_msg: "OK — rule {{ item.rule_name }} present and identical"
            fail_msg: >-
              FAILED — rule {{ item.rule_name }} missing or different:
              {% for k in differences %}{{ k }} expected {{ item[k] }}, got {{ actual[k] | default('missing') }}; {% endfor %}
            quiet: true
          loop: "{{ gitea_branch_protections }}"
          loop_control: { label: "{{ item.rule_name }}" }

        - name: The robot svc-orchestrator can no longer change the protections of the tool
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ slug }}/branch_protections/main"
            method: PATCH
            url_username: ""
            url_password: ""
            force_basic_auth: false
            headers:
              Authorization: "token {{ token.json.sha1 }}"
            body: { enable_push_whitelist: false }
            status_code: 403
          no_log: true

        - name: The robot svc-orchestrator still pushes to main of the tool (write through its team)
          ansible.builtin.shell:  # noqa: command-instead-of-module (HTTP header, see role gitea_org)
            cmd: >-
              rm -rf {{ workdir }} &&
              git -c http.extraHeader="Authorization: token {{ token.json.sha1 }}"
              clone -q http://127.0.0.1:3000/{{ gitea_org }}/{{ slug }}.git {{ workdir }} &&
              cd {{ workdir }} && echo "// trial" >> api/trial-e2.js && git add -A &&
              git -c user.name=svc-orchestrator -c user.email=svc-orchestrator@{{ base_domain }} commit -q -m "trial E2" &&
              git -c http.extraHeader="Authorization: token {{ token.json.sha1 }}"
              push -q origin HEAD:main
          register: push_main
          failed_when: false
          changed_when: false
          no_log: true

        - name: After the removal, svc-orchestrator keeps write access to main
          ansible.builtin.assert:
            that: push_main.rc == 0
            success_msg: "OK — svc-orchestrator still pushes to main of the tool"
            fail_msg: "FAILED — svc-orchestrator no longer pushes to main of the tool"
            quiet: true

        # Simulated hard stop: the repository is generated by the engine's token,
        # and nothing else (no team, no removal of the administration).
        - name: Simulated hard stop — generation only, by svc-orchestrator
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/tool-template/generate"
            method: POST
            url_username: ""
            url_password: ""
            force_basic_auth: false
            headers:
              Authorization: "token {{ token.json.sha1 }}"
            body: { owner: "{{ gitea_org }}", name: "{{ resumed_slug }}", private: true, git_content: true, protected_branch: true }
            status_code: 201
          no_log: true

        # Repository with the name of a tool, created by a human (not from the template).
        - name: Repository created by a human
          ansible.builtin.uri:
            url: "{{ gitea_api }}/orgs/{{ gitea_org }}/repos"
            method: POST
            body: { name: "{{ human_slug }}", private: true, auto_init: true, default_branch: main }
            status_code: 201

        - name: The engine resumes the interrupted creation, then tries the human's repository
          ansible.builtin.command:
            argv: >-
              {{ ['docker', 'run', '--rm', '--network', 'host', '--read-only', '--cap-drop', 'ALL',
                  '--security-opt', 'no-new-privileges:true', '--user', '1000',
                  '-v', trial_dir ~ ':/trial:ro',
                  '-e', 'FORGE_URL=https://' ~ gitea_domain, '-e', 'FORGE_TOKEN_FILE=/trial/token']
                 + (['-v', lab_ca_crt ~ ':/lab-ca.crt:ro', '-e', 'NODE_EXTRA_CA_CERTS=/lab-ca.crt'] if lab_ca.stat.exists else [])
                 + [trial_image, 'node', '/trial/scripts/trial-forge.ts', 'create', item] }}
          loop: ["{{ resumed_slug }}", "{{ human_slug }}"]
          delegate_to: "{{ orchestrator }}"
          register: resumptions
          changed_when: true
          failed_when: false

        - name: Interrupted creation finished; human's repository refused
          ansible.builtin.assert:
            that:
              - resumptions.results[0].rc == 0
              - resumptions.results[1].rc == 1
              - "'(refusal)' in resumptions.results[1].stderr"
            success_msg: "OK — resumed: {{ resumptions.results[0].stdout }}; human: {{ resumptions.results[1].stderr }}"
            fail_msg: >-
              FAILED — resumed rc={{ resumptions.results[0].rc }} {{ resumptions.results[0].stderr }};
              human rc={{ resumptions.results[1].rc }} (1 expected) {{ resumptions.results[1].stdout }} {{ resumptions.results[1].stderr }}
            quiet: true

        - name: Read the state of both repositories (admin)
          ansible.builtin.uri:
            url: "{{ gitea_api }}{{ item }}"
            status_code: [200, 204, 404]
          loop:
            - "/repos/{{ gitea_org }}/{{ resumed_slug }}/collaborators/svc-orchestrator"
            - "/teams/{{ agents_team }}/repos/{{ gitea_org }}/{{ resumed_slug }}"
            - "/teams/{{ agents_team }}/repos/{{ gitea_org }}/{{ human_slug }}"
          register: states

        - name: Resumed — same final state; human — nothing changed
          ansible.builtin.assert:
            that:
              - states.results[0].status == 404
              - states.results[1].status == 200
              - states.results[2].status == 404
            success_msg: "OK — resumed repository assigned, without the robot's administration; human's repository untouched"
            fail_msg: >-
              FAILED — resumed: collaborator {{ states.results[0].status }} (404 expected), team {{ states.results[1].status }} (200);
              human: team {{ states.results[2].status }} (404 expected)
            quiet: true

      always:
        - name: Delete the temporary token
          ansible.builtin.uri:
            url: "{{ gitea_api }}/users/svc-orchestrator/tokens/{{ token_name }}"
            method: DELETE
            status_code: [204, 404]

        # Only the admin deletes a repository (the engine never deletes anything).
        - name: Delete the trial repositories
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ item }}"
            method: DELETE
            status_code: [204, 404]
          loop: ["{{ slug }}", "{{ resumed_slug }}", "{{ human_slug }}"]

        - name: Delete the trial files (token included)
          ansible.builtin.file:
            path: "{{ trial_dir }}"
            state: absent
          delegate_to: "{{ orchestrator }}"

        - name: Delete the local copy
          ansible.builtin.file:
            path: "{{ workdir }}"
            state: absent
