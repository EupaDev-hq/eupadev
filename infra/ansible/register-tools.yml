# Registration of the core tools after Gate 1 (D-E5, S5, S8). Run by the
# admin after adding the tool's entry to group_vars/all/core-tools.yml:
#   ansible-playbook register-tools.yml </dev/null
# Idempotent (second run: changed=0); nothing is ever removed.
# 1. Keycloak (realm tools, through its configuration client): clients <slug>
#    (Prod) and <slug>-preview, shaped like the core's test client, with the tool
#    roles; their secrets generated by Keycloak, read back in memory.
# 2. Each target VM (CI: Preview, tools: Prod): database <slug> and roles
#    <slug>_owner|_app|_purge by the core's sql/roles.sql, passwords
#    generated once; database URLs and client secret encrypted with
#    systemd-creds; a Gate 1 entry <slug>.json (client id, retentions) that
#    eupadev-deployer requires for a core image.
# 3. Test personas: two
#    users per role, <slug>-<role>-<n>, each with that single role on the
#    <slug>-preview client only (Prod answers 403 "No role for this tool");
#    passwords generated once, kept encrypted on the orchestrator VM
#    (systemd-creds), written as JSON [{name, password, roles}] into the tool
#    repository's Actions secret PREVIEW_PERSONAS (repository, not
#    organisation: no other tool sees it), rewritten only when missing or when
#    a password is new. Exposure, accepted: the acceptance job runs
#    agent-written test code with these passwords; a leak gives a login on
#    that tool's Preview, as a persona, nothing else (no Prod role, direct
#    access grants off on every client). Rotation: delete
#    /etc/eupadev/credstore.encrypted/persona-<slug>-* on the orchestrator
#    VM, then rerun.
- name: Core tools — Keycloak clients (realm tools)
  hosts: orchestrator
  become: true
  gather_facts: false
  # Slug rules of the deployer (deployer_slug_max, deployer_reserved_names)
  # and keycloak_admin_url.
  vars_files: [roles/deployer/defaults/main.yml, roles/keycloak/defaults/main.yml]
  tasks:
    - name: Valid entries (slug as the deployer accepts it, retentions)
      ansible.builtin.assert:
        that:
          - item.slug is regex('^[a-z0-9]+(-[a-z0-9]+)*$')
          - item.slug | length <= deployer_slug_max
          - item.slug not in deployer_reserved_names
          - item.roles | length > 0
          - item.retentions.RETENTION_AUDIT is defined
          - item.retentions | dict2items | rejectattr('key', 'regex', '^RETENTION_[A-Z][A-Z0-9_]*$') | list | length == 0
          - item.retentions | dict2items | rejectattr('value', 'regex', core_tools_duration) | list | length == 0
        fail_msg: "Invalid Gate 1 entry: {{ item.slug | default('?') }}"
        quiet: true
      loop: "{{ core_tools }}"
      loop_control:
        label: "{{ item.slug | default('?') }}"

    - name: Clients, roles and secrets
      vars:
        model: "{{ keycloak_tools_realm.clients | selectattr('clientId', 'eq', 'trial-tool') | first }}"
        # One item per (tool, environment): {slug, suffix, host}.
        clients: >-
          {{ core_tools | map(attribute='slug') | map('community.general.dict_kv', 'slug')
             | product([{'suffix': '', 'host': ''}, {'suffix': '-preview', 'host': '.preview'}])
             | map('combine') | list }}
      module_defaults:
        group/community.general.keycloak:
          auth_keycloak_url: "{{ keycloak_admin_url }}"
          auth_realm: tools
          auth_client_id: tools-config
          auth_client_secret: "{{ vault_keycloak_tools_config_secret }}"
      block:
        # Same shape as the core's test client (realm-test.json): confidential,
        # code + PKCE, back-channel logout, client roles in the ID token.
        - name: Client of each tool and environment
          community.general.keycloak_client:
            realm: tools
            client_id: "{{ cid }}"
            description: "Core tool {{ item.slug }}{{ ' (Preview)' if item.suffix else ' (Prod)' }}"
            enabled: true
            public_client: false
            client_authenticator_type: client-secret
            standard_flow_enabled: true
            implicit_flow_enabled: false
            direct_access_grants_enabled: false
            service_accounts_enabled: false
            full_scope_allowed: false
            frontchannel_logout: false
            redirect_uris: ["{{ address }}/auth/callback"]
            web_origins: []
            attributes: >-
              {{ model.attributes | combine({'post.logout.redirect.uris': address ~ '/',
                                             'backchannel.logout.url': address ~ '/auth/backchannel-logout'}) }}
            client_scopes_behavior: idempotent
            default_client_scopes: "{{ model.defaultClientScopes }}"
            optional_client_scopes: "{{ model.optionalClientScopes }}"
            protocol_mappers: >-
              {{ [model.protocolMappers[0] | combine({'config': {'usermodel.clientRoleMapping.clientId': cid}}, recursive=true)] }}
          vars:
            cid: "{{ item.slug ~ item.suffix }}"
            address: "https://{{ item.slug }}{{ item.host }}.{{ base_domain }}"
          loop: "{{ clients }}"
          loop_control:
            label: "{{ cid }}"

        - name: Tool roles on both clients
          community.general.keycloak_role:
            realm: tools
            client_id: "{{ item.0.0.slug ~ item.1 }}"
            name: "{{ item.0.1.name }}"
            description: "{{ item.0.1.description }}"
          loop: "{{ core_tools | subelements('roles') | product(['', '-preview']) | list }}"
          loop_control:
            label: "{{ item.0.0.slug ~ item.1 }}/{{ item.0.1.name }}"

        - name: Persona passwords already encrypted
          ansible.builtin.command:
            argv: [systemd-creds, decrypt, --newline=no, "--name=persona-{{ item.name }}",
                   "/etc/eupadev/credstore.encrypted/persona-{{ item.name }}", "-"]
          loop: "{{ core_tools_personas }}"
          register: tools_personas_read
          changed_when: false
          failed_when: false
          check_mode: false  # read only
          no_log: true

        # Letters and digits only, generated once; `new` = not readable above.
        - name: Persona passwords
          ansible.builtin.set_fact:
            tools_personas: >-
              {%- set l = [] -%}
              {%- for r in tools_personas_read.results -%}
                {%- set new = r.rc != 0 or r.stdout == '' -%}
                {%- set _ = l.append(r.item | combine({'new': new, 'password': lookup('ansible.builtin.password', '/dev/null', length=32,
                    chars=['ascii_letters', 'digits']) if new else r.stdout})) -%}
              {%- endfor -%}
              {{ l }}
          no_log: true

        - name: Encrypted secrets folder (root only)
          ansible.builtin.file:
            path: /etc/eupadev/credstore.encrypted
            state: directory
            mode: "0700"

        # The module never compares credentials: a new password recreates the user (force).
        - name: Persona users
          community.general.keycloak_user:
            realm: tools
            username: "{{ item.name }}"
            first_name: "{{ item.slug }}"
            last_name: "{{ item.role }} {{ item.name[-1] }}"
            email: "{{ item.name }}@personas.{{ base_domain }}"
            email_verified: true
            enabled: true
            credentials: [{ type: password, value: "{{ item.password }}", temporary: false }]
            force: "{{ item.new }}"
          loop: "{{ tools_personas }}"
          no_log: true

        - name: Persona role, on the Preview client only
          community.general.keycloak_user_rolemapping:
            realm: tools
            target_username: "{{ item.name }}"
            client_id: "{{ item.slug }}-preview"
            roles: [{ name: "{{ item.role }}" }]
          loop: "{{ core_tools_personas }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Encrypt new persona passwords
          ansible.builtin.command:
            argv: [systemd-creds, encrypt, --with-key=auto, "--name=persona-{{ item.name }}", "-",
                   "/etc/eupadev/credstore.encrypted/persona-{{ item.name }}"]
            stdin: "{{ item.password }}"
            stdin_add_newline: false
          loop: "{{ tools_personas }}"
          when: item.new
          changed_when: true
          no_log: true

        # Real people (core_tools_people): temporary password generated once,
        # never reset afterwards (the person's own password wins).
        - name: People's grants name a registered tool and one of its roles
          ansible.builtin.assert:
            that:
              - item.username is regex('^[a-z][a-z0-9.-]*$')
              - item.username not in (core_tools_personas | map(attribute='name'))
              - item.role in (core_tools | selectattr('slug', 'eq', item.tool) | map(attribute='roles') | flatten | map(attribute='name'))
            fail_msg: "Invalid entry of core_tools_people: {{ item }}"
            quiet: true
          loop: "{{ core_tools_people }}"

        - name: People's passwords already encrypted
          ansible.builtin.stat:
            path: "/etc/eupadev/credstore.encrypted/person-{{ item }}"
          loop: "{{ core_tools_people | map(attribute='username') | unique }}"
          register: people_stored

        - name: People's temporary passwords
          ansible.builtin.set_fact:
            tools_people: >-
              {%- set l = [] -%}
              {%- for r in people_stored.results if not r.stat.exists -%}
                {%- set _ = l.append({'username': r.item, 'password': lookup('ansible.builtin.password', '/dev/null', length=24,
                    chars=['ascii_letters', 'digits'])}) -%}
              {%- endfor -%}
              {{ l }}
          no_log: true

        - name: New people, temporary password
          community.general.keycloak_user:
            realm: tools
            username: "{{ item.username }}"
            first_name: "{{ item.username }}"
            last_name: "{{ item.username }}"
            email: "{{ item.username }}@people.{{ base_domain }}"
            email_verified: true
            enabled: true
            credentials: [{ type: password, value: "{{ item.password }}", temporary: true }]
          loop: "{{ tools_people }}"
          no_log: true

        - name: Encrypt the new people's temporary passwords
          ansible.builtin.command:
            argv: [systemd-creds, encrypt, --with-key=auto, "--name=person-{{ item.username }}", "-",
                   "/etc/eupadev/credstore.encrypted/person-{{ item.username }}"]
            stdin: "{{ item.password }}"
            stdin_add_newline: false
          loop: "{{ tools_people }}"
          changed_when: true
          no_log: true

        - name: People's role, on the Prod client only
          community.general.keycloak_user_rolemapping:
            realm: tools
            target_username: "{{ item.username }}"
            client_id: "{{ item.tool }}"
            roles: [{ name: "{{ item.role }}" }]
          loop: "{{ core_tools_people }}"
          loop_control:
            label: "{{ item.username }} → {{ item.tool }}/{{ item.role }}"

        - name: Client secrets (generated by Keycloak)
          community.general.keycloak_clientsecret_info:
            realm: tools
            client_id: "{{ item.slug ~ item.suffix }}"
          loop: "{{ clients }}"
          register: core_tools_secrets_kc
          no_log: true

        # Kept in memory for the next play (hostvars), never written here.
        - name: Secrets by client id
          ansible.builtin.set_fact:
            core_tools_oidc: >-
              {%- set d = {} -%}
              {%- for r in core_tools_secrets_kc.results -%}
                {%- set _ = d.update({r.item.slug ~ r.item.suffix: r.clientsecret_info.value}) -%}
              {%- endfor -%}
              {{ d }}
          no_log: true

- name: Core tools — database, secrets and entry on each target VM
  hosts: ci:tools
  become: true
  gather_facts: false
  vars:
    core_tools_env: "{{ 'prod' if 'tools' in group_names else 'preview' }}"
  tasks:
    - name: Each tool
      ansible.builtin.include_tasks: tasks/core-tool-target.yml
      loop: "{{ core_tools }}"
      loop_control:
        loop_var: tool
        label: "{{ tool.slug }}"
  handlers:
    - name: Decrypt the tool secrets into /run
      ansible.builtin.systemd_service:
        name: eupadev-tools-secrets.service
        state: restarted

- name: Core tools — personas in each tool repository's Actions secrets
  hosts: forge
  gather_facts: false
  vars:
    personas: "{{ hostvars[groups['orchestrator'][0]].tools_personas }}"
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ gitea_admin_user }}"
      url_password: "{{ vault_gitea_admin_password }}"
      force_basic_auth: true
  tasks:
    # 404 here: the tool repository does not exist (it is created before Gate 1).
    - name: Secrets of each tool repository
      ansible.builtin.uri:
        url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ item.slug }}/actions/secrets"
        return_content: true
      loop: "{{ core_tools }}"
      loop_control:
        label: "{{ item.slug }}"
      register: tool_repo_secrets

    - name: PREVIEW_PERSONAS, when missing or a password is new
      ansible.builtin.uri:
        url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ item.item.slug }}/actions/secrets/PREVIEW_PERSONAS"
        method: PUT
        body_format: json
        body:
          data: >-
            {%- set l = [] -%}
            {%- for p in personas if p.slug == item.item.slug -%}
              {%- set _ = l.append({'name': p.name, 'password': p.password, 'roles': [p.role]}) -%}
            {%- endfor -%}
            {{ l | to_json }}
        status_code: [201, 204]
      loop: "{{ tool_repo_secrets.results }}"
      when: >-
        'PREVIEW_PERSONAS' not in (item.json | map(attribute='name'))
        or personas | selectattr('slug', 'eq', item.item.slug) | selectattr('new') | list | length > 0
      changed_when: true
      no_log: true
