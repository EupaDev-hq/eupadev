# Real-conditions check of the forge's rights — rerunnable.
#   ansible-playbook verify-forge.yml
# Creates a trial repository with a protected main, gives temporary tokens to
# the robots, attempts real `git push`es, checks the result, then deletes
# everything (repository, tokens, local copy), even if a check fails.
#
# Expected (each trial starts from a fresh copy of main):
#   svc-agent         → main                      : REFUSED
#   svc-agent         → agent/check/builder, api/ : accepted
#   svc-agent         → agent/check/builder, .gitea/ (pipeline) : REFUSED
#   svc-agent         → agent/check/builder, AGENTS.md          : REFUSED
#   svc-agent         → agent/check/builder, Dockerfile, api/Dockerfile,
#                       .dockerignore, .pnpmfile.mjs (A-R0)     : REFUSED
#   svc-agent         → another branch, .gitea/ (pipeline)      : REFUSED
#     (otherwise an agent would write, outside agent/**, a pipeline that
#     targets the "image" runner and reads the organisation's secrets)
#   svc-orchestrator → main                      : accepted
#   svc-agent → platform repositories (tool-template, base-image):
#     REFUSED for writing and invisible for reading (the agents team only
#     has access to the tool repositories the orchestrator assigns to it)
#   svc-* accounts    : Bot type (Gitea 28: token only, no password)
#   audit log         : the creation of the tokens is recorded there
#   tool generated from the template (protected_branch): same protections
#     as gitea_branch_protections, from its creation
#   svc-orchestrator → main: .gitea/ and exceptions registry REFUSED;
#     exception PR: merge refused to the orchestrator, accepted for ilan
#   ilan → exception/**: accepted; → main directly: REFUSED
#   tool generated by svc-orchestrator: it removes its own administration
#     and can no longer touch the protections
#   registry cleanup (trial package, 5 signed builds, the oldest in
#     service): the playbook sorts (trial mode), the timer's unit
#     ("trial" instance) erases the same; the last 3 + the one in service
#     remain, each with its signature; weekly timer active, parameters ==
#     group_vars, password 0600 root
- name: Check the forge's rights
  hosts: forge
  become: true
  vars:
    repo: check-protection
    # Outside the check- prefix: the cleanup erases those packages entirely.
    registry_package: cleanup-trial
    workdir: /tmp/check-forge
    token_name: "check-{{ ansible_date_time.epoch }}"
    push_tests:
      - { user: svc-agent, branch: main, file: api/trial.js, expect: refused }
      - { user: svc-agent, branch: agent/check/builder, file: api/trial.js, expect: accepted }
      - { user: svc-agent, branch: agent/check/builder, file: .gitea/workflows/theft.yml, expect: refused }
      - { user: svc-agent, branch: agent/check/builder, file: AGENTS.md, expect: refused }
      - { user: svc-agent, branch: agent/check/builder, file: .gitleaksignore, expect: refused }
      - { user: svc-agent, branch: agent/check/builder, file: .semgrepignore, expect: refused }
      - { user: svc-agent, branch: agent/check/builder, file: .trivyignore.yaml, expect: refused }
      # A-R0: the image belongs to the platform (fixed Dockerfile .gitea/image/).
      - { user: svc-agent, branch: agent/check/builder, file: Dockerfile, expect: refused }
      - { user: svc-agent, branch: agent/check/builder, file: api/Dockerfile, expect: refused }
      - { user: svc-agent, branch: agent/check/builder, file: .dockerignore, expect: refused }
      - { user: svc-agent, branch: agent/check/builder, file: .pnpmfile.mjs, expect: refused }
      - { user: svc-agent, branch: check/outside-agent, file: .gitea/workflows/theft.yml, expect: refused }
      - { user: svc-orchestrator, branch: main, file: api/merge.js, expect: accepted }
      # Hole 4: the orchestrator touches neither the pipelines nor the exceptions registry.
      - { user: svc-orchestrator, branch: main, file: .gitea/workflows/theft.yml, expect: refused }
      - { user: svc-orchestrator, branch: main, file: .gitea/exceptions.txt, expect: refused }
      - { user: svc-orchestrator, branch: check/orchestrator, file: .gitea/workflows/theft.yml, expect: refused }
      # Human path: only a human pushes to exception/**, never directly to main.
      - { user: svc-orchestrator, branch: exception/check, file: .gitea/exceptions.txt, expect: refused }
      - { user: svc-agent, branch: exception/check, file: api/trial.js, expect: refused }
      - { user: ilan, branch: main, file: api/trial.js, expect: refused }
      - { user: ilan, branch: exception/check, file: .gitea/exceptions.txt, expect: accepted }
      - { user: svc-agent, repo: tool-template, branch: agent/theft/kit, file: AGENTS.md, expect: refused }
      - { user: svc-agent, repo: base-image, branch: agent/theft/image, file: Dockerfile, expect: refused }
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ gitea_admin_user }}"
      url_password: "{{ vault_gitea_admin_password }}"
      force_basic_auth: true
      body_format: json
      return_content: true
  tasks:
    - name: Checks
      block:
        - name: Create the trial repository (with a first commit on main)
          ansible.builtin.uri:
            url: "{{ gitea_api }}/orgs/{{ gitea_org }}/repos"
            method: POST
            body: { name: "{{ repo }}", private: true, auto_init: true, default_branch: main }
            status_code: 201

        # As the orchestrator will do: the tool repository is assigned to the agents team.
        - name: Read the organisation's teams
          ansible.builtin.uri:
            url: "{{ gitea_api }}/orgs/{{ gitea_org }}/teams?limit=50"
          register: teams

        - name: Assign the trial repository to the agents team
          ansible.builtin.uri:
            url: "{{ gitea_api }}/teams/{{ (teams.json | selectattr('name', 'equalto', 'agents') | first).id }}/repos/{{ gitea_org }}/{{ repo }}"
            method: PUT
            status_code: 204

        # Same rules as those the orchestrator will set on each tool.
        - name: Apply the branch protections (gitea_branch_protections)
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ repo }}/branch_protections"
            method: POST
            body: "{{ item }}"
            status_code: 201
          loop: "{{ gitea_branch_protections }}"
          loop_control: { label: "{{ item.rule_name }}" }

        # Audit log (Gitea 28, [audit] RECORD_OUTPUT=database): read in the
        # database, read-only — the reading API only exists in the
        # Enterprise edition.
        - name: Number of audit events before the creation of the tokens
          ansible.builtin.command:
            argv: [docker, compose, exec, -T, db, psql, -U, gitea, -d, gitea, -tAc, "SELECT count(*) FROM audit_event"]
            chdir: /opt/eupadev/forge
          register: audit_before
          changed_when: false

        - name: Temporary tokens of the tested accounts
          ansible.builtin.uri:
            url: "{{ gitea_api }}/users/{{ item }}/tokens"
            method: POST
            body:
              name: "{{ token_name }}"
              # The orchestrator also generates a tool in the organisation (hole 1).
              scopes: "{{ ['write:repository', 'write:organization'] if item == 'svc-orchestrator' else ['write:repository'] }}"
            status_code: 201
          loop: [svc-agent, svc-orchestrator, ilan]
          register: tokens
          no_log: true

        - name: Local copy of the trial repository
          ansible.builtin.shell:  # noqa: command-instead-of-module (HTTP header, see role gitea_org)
            cmd: >-
              rm -rf {{ workdir }} &&
              git -c http.extraHeader="Authorization: Basic {{ (gitea_admin_user ~ ':' ~ vault_gitea_admin_password) | b64encode }}"
              clone -q http://127.0.0.1:3000/{{ gitea_org }}/{{ repo }}.git {{ workdir }}
          no_log: true
          changed_when: false

        - name: Attempts of git push with each robot's token
          ansible.builtin.shell:  # noqa: command-instead-of-module (HTTP header, see role gitea_org)
            chdir: "{{ workdir }}"
            cmd: >-
              git -c http.extraHeader="Authorization: Basic {{ (gitea_admin_user ~ ':' ~ vault_gitea_admin_password) | b64encode }}"
              fetch -q origin &&
              git checkout -q -B trial origin/main &&
              mkdir -p "$(dirname '{{ item.file }}')" &&
              echo "// trial {{ item.user }}" >> '{{ item.file }}' &&
              git add -A &&
              git -c user.name={{ item.user }} -c user.email={{ item.user }}@{{ base_domain }}
              commit -q -m "trial {{ item.user }} to {{ item.branch }} ({{ item.file }})" &&
              git -c http.extraHeader="Authorization: token {{ (tokens.results | selectattr('item', 'equalto', item.user) | first).json.sha1 }}"
              push -q http://127.0.0.1:3000/{{ gitea_org }}/{{ item.repo | default(repo) }}.git HEAD:refs/heads/{{ item.branch }}
          loop: "{{ push_tests }}"
          register: pushes
          failed_when: false
          changed_when: false
          no_log: true

        # Only the trial and its return code are kept: the raw result
        # holds the command, hence the credentials (never print it).
        - name: Keep the result of each trial, without the command
          ansible.builtin.set_fact:
            # git's "remote: / fatal: / error:" lines give the reason of a refusal, without credentials.
            push_results: >-
              {{ push_results | default([]) + [item.item | combine({'rc': item.rc,
                 'reason': item.stderr_lines | default([]) | select('match', '^(remote|fatal|error):') | join(' ')})] }}
          loop: "{{ pushes.results }}"
          loop_control: { label: "{{ item.item.user }} → {{ item.item.branch }}" }
          no_log: true

        - name: Compare with the expected result
          ansible.builtin.assert:
            that: >-
              (item.rc != 0) == (item.expect == 'refused')
            success_msg: "OK — {{ item.user }} → {{ item.repo | default(repo) }} {{ item.branch }} ({{ item.file }}): {{ item.expect }}"
            fail_msg: >-
              FAILED — {{ item.user }} → {{ item.repo | default(repo) }} {{ item.branch }}: expected {{ item.expect }},
              got {{ 'refused' if item.rc != 0 else 'accepted' }} {{ item.reason }}
            quiet: true
          loop: "{{ push_results }}"
          loop_control: { label: "{{ item.user }} → {{ item.branch }} ({{ item.file }})" }

        # Hole 3: an exception (protected file) only reaches main through a
        # PR merged by a human of the bypass list. The branch
        # exception/check has just been pushed by ilan (trial above).
        - name: PR of the exception to main
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ repo }}/pulls"
            method: POST
            body: { head: exception/check, base: main, title: "Exception to approve" }
            status_code: 201
          register: pr_exception

        - name: The orchestrator cannot merge a PR that touches a protected file
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ repo }}/pulls/{{ pr_exception.json.number }}/merge"
            method: POST
            url_username: ""
            url_password: ""
            force_basic_auth: false
            headers:
              Authorization: "token {{ (tokens.results | selectattr('item', 'equalto', 'svc-orchestrator') | first).json.sha1 }}"
            # force_merge: the bypass is applied only on request (Gitea 28).
            body: { Do: merge, force_merge: true }
            status_code: [403, 405]
          no_log: true

        # Gitea computes mergeability in the background: retry.
        - name: The human merges the exception PR
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ repo }}/pulls/{{ pr_exception.json.number }}/merge"
            method: POST
            url_username: ""
            url_password: ""
            force_basic_auth: false
            headers:
              Authorization: "token {{ (tokens.results | selectattr('item', 'equalto', 'ilan') | first).json.sha1 }}"
            # force_merge: the bypass is applied only on request (Gitea 28).
            body: { Do: merge, force_merge: true }
            status_code: [200, 405]
          register: human_merge
          until: human_merge.status == 200
          retries: 10
          delay: 3
          failed_when: false
          no_log: true

        - name: The human merge is accepted
          ansible.builtin.assert:
            that: human_merge.status == 200
            success_msg: "OK — ilan merges the PR that touches the exceptions registry"
            fail_msg: "FAILED — merge by ilan refused ({{ human_merge.status }}): {{ human_merge.json.message | default('') }}"
            quiet: true

        # Hole 1: Gitea makes the creator of a repository its administrator. As
        # the orchestrator will do: it generates the tool, then removes that right.
        - name: The orchestrator generates a tool (protections included)
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/tool-template/generate"
            method: POST
            url_username: ""
            url_password: ""
            force_basic_auth: false
            headers:
              Authorization: "token {{ (tokens.results | selectattr('item', 'equalto', 'svc-orchestrator') | first).json.sha1 }}"
            body: { owner: "{{ gitea_org }}", name: "{{ repo }}-orch", private: true, git_content: true, protected_branch: true }
            status_code: 201
          no_log: true

        - name: The orchestrator removes its own administration right
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ repo }}-orch/collaborators/svc-orchestrator"
            method: DELETE
            url_username: ""
            url_password: ""
            force_basic_auth: false
            headers:
              Authorization: "token {{ (tokens.results | selectattr('item', 'equalto', 'svc-orchestrator') | first).json.sha1 }}"
            status_code: 204
          no_log: true

        # The right that matters: its team (write per part of the repository)
        # leaves it the push to main; the "permission" API summarises these
        # rights per part as "none", hence a real push rather than reading it.
        - name: The orchestrator still pushes to the tool's main (write through its team)
          ansible.builtin.shell:  # noqa: command-instead-of-module (HTTP header, see role gitea_org)
            cmd: >-
              rm -rf {{ workdir }}-orch &&
              git -c http.extraHeader="Authorization: token {{ (tokens.results | selectattr('item', 'equalto', 'svc-orchestrator') | first).json.sha1 }}"
              clone -q http://127.0.0.1:3000/{{ gitea_org }}/{{ repo }}-orch.git {{ workdir }}-orch &&
              cd {{ workdir }}-orch && echo "// trial" >> api/trial-orch.js && git add -A &&
              git -c user.name=svc-orchestrator -c user.email=svc-orchestrator@{{ base_domain }} commit -q -m "trial after removal" &&
              git -c http.extraHeader="Authorization: token {{ (tokens.results | selectattr('item', 'equalto', 'svc-orchestrator') | first).json.sha1 }}"
              push -q origin HEAD:main
          register: push_orch
          failed_when: false
          changed_when: false
          no_log: true

        - name: After the removal, the orchestrator keeps write access
          ansible.builtin.assert:
            that: push_orch.rc == 0
            success_msg: "OK — svc-orchestrator still pushes to main of the generated tool"
            fail_msg: "FAILED — svc-orchestrator no longer pushes to main of the generated tool"
            quiet: true

        - name: The orchestrator can no longer change the tool's protections
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ repo }}-orch/branch_protections/main"
            method: PATCH
            url_username: ""
            url_password: ""
            force_basic_auth: false
            headers:
              Authorization: "token {{ (tokens.results | selectattr('item', 'equalto', 'svc-orchestrator') | first).json.sha1 }}"
            body: { enable_push_whitelist: false }
            status_code: 403
          no_log: true

        - name: Read the type of the service accounts
          ansible.builtin.uri:
            url: "{{ gitea_api }}/users/{{ item.user }}"
          loop: "{{ gitea_service_accounts + [gitea_core_org] }}"
          loop_control: { label: "{{ item.user }}" }
          register: accounts

        - name: The service accounts are robots (token only, no password)
          ansible.builtin.assert:
            that: item.json.type == 'Bot'
            success_msg: "OK — {{ item.item.user }} is a robot"
            fail_msg: "FAILED — {{ item.item.user }} is of type {{ item.json.type }}, not Bot"
            quiet: true
          loop: "{{ accounts.results }}"
          loop_control: { label: "{{ item.item.user }}" }

        - name: Number of audit events after the creation of the tokens
          ansible.builtin.command:
            argv: [docker, compose, exec, -T, db, psql, -U, gitea, -d, gitea, -tAc, "SELECT count(*) FROM audit_event"]
            chdir: /opt/eupadev/forge
          register: audit_after
          changed_when: false

        - name: The creation of the tokens is recorded in the audit log
          ansible.builtin.assert:
            that: audit_after.stdout | int > audit_before.stdout | int
            success_msg: "OK — audit log: {{ audit_before.stdout }} → {{ audit_after.stdout }} events"
            fail_msg: "FAILED — no audit event after the creation of two tokens ({{ audit_after.stdout }})"
            quiet: true

        - name: The agents' robot does not see the platform repositories
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ item }}"
            url_username: ""
            url_password: ""
            force_basic_auth: false
            headers:
              Authorization: "token {{ (tokens.results | selectattr('item', 'equalto', 'svc-agent') | first).json.sha1 }}"
            status_code: 404
          loop: "{{ gitea_platform_repos | map(attribute='name') }}"
          no_log: true

        # As the orchestrator will do: a tool generated with protected_branch
        # receives the template's protections from its creation (Gitea 28).
        - name: Generate a tool from the template, protections included
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/tool-template/generate"
            method: POST
            body: { owner: "{{ gitea_org }}", name: "{{ repo }}-generated", private: true, git_content: true, protected_branch: true }
            status_code: 201

        - name: Read the protections of the generated tool
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ repo }}-generated/branch_protections"
          register: protections_generated

        - name: The generated tool has exactly the protections of gitea_branch_protections
          vars:
            actual_rule: "{{ protections_generated.json | selectattr('rule_name', 'equalto', item.rule_name) | first | default({}) }}"
            # Fields of the expected rule whose value differs on the generated tool
            # (lists compared without order: Gitea returns them sorted).
            differences: >-
              {%- set ns = namespace(e=[]) -%}
              {%- for k, v in item.items() -%}
              {%- set a = actual_rule[k] | default(none) -%}
              {%- if v is sequence and v is not string -%}{%- set a = (a or []) | sort -%}{%- set v = v | sort -%}{%- endif -%}
              {%- if a != v -%}{%- set ns.e = ns.e + [k] -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.e }}
          ansible.builtin.assert:
            that: differences | length == 0
            success_msg: "OK — generated tool: rule {{ item.rule_name }} present and identical"
            fail_msg: >-
              FAILED — generated tool: rule {{ item.rule_name }} missing or different:
              {% for k in differences %}{{ k }} expected {{ item[k] }}, got {{ actual_rule[k] | default('missing') }}; {% endfor %}
            quiet: true
          loop: "{{ gitea_branch_protections }}"
          loop_control: { label: "{{ item.rule_name }}" }

        # ---- Registry cleanup (registry-cleanup.yml) ----
        # Trial package: 5 signed builds; the 1st, the oldest, is "in
        # service". Then the last 3 + the one in service remain, each with
        # its signature and its untagged manifests.
        - name: Install the script of the registry's trial package
          ansible.builtin.copy:
            src: files/trial-registry.py
            dest: /opt/eupadev/trial-registry.py
            mode: "0755"

        - name: Push 5 signed builds into the trial package
          ansible.builtin.command:
            argv: [python3, /opt/eupadev/trial-registry.py]
            stdin: >-
              {{ {'root': 'http://127.0.0.1:3000', 'org': gitea_org, 'package': registry_package, 'builds': 5,
                  'user': gitea_admin_user, 'password': vault_gitea_admin_password} | to_json }}
          register: registry_trial
          changed_when: true
          failed_when: false
          no_log: true

        - name: The 5 builds are pushed
          ansible.builtin.assert:
            that: registry_trial.rc == 0
            fail_msg: "FAILED — trial package not pushed: {{ registry_trial.stderr_lines | default([]) | last | default('?') }}"
            quiet: true

        # The playbook sorts in trial mode, then the timer's systemd unit
        # ("trial" instance: this package only) erases: same sort expected.
        - name: Sort the trial package as registry-cleanup.yml does (trial mode)
          ansible.builtin.include_tasks: tasks/registry-cleanup.yml
          vars:
            cleanup_apply: false
            cleanup_in_service: ["{{ gitea_domain }}/{{ gitea_org }}/{{ registry_package }}@{{ (registry_trial.stdout | from_json)[0].digest }}"]
            cleanup_movable: []
            cleanup_packages: ["{{ registry_package }}"]
            cleanup_grace_minutes: 0  # package pushed just now

        - name: Keep the playbook's sort
          ansible.builtin.set_fact:
            registry_playbook_sort: "{{ cleanup_result }}"

        - name: Parameters of the unit's trial instance (no secret)
          ansible.builtin.copy:
            dest: /etc/eupadev-registry-cleanup/trial.json
            content: "{{ settings | to_nice_json }}\n"
            mode: "0644"
          vars:
            settings:
              root: http://127.0.0.1:3000
              org: "{{ gitea_org }}"
              user: "{{ gitea_admin_user }}"
              in_service: ["{{ gitea_domain }}/{{ gitea_org }}/{{ registry_package }}@{{ (registry_trial.stdout | from_json)[0].digest }}"]
              movable_tags: []
              packages: ["{{ registry_package }}"]
              grace_minutes: 0
              apply: true

        - name: Start the timer's unit on the trial package
          ansible.builtin.systemd_service:
            name: eupadev-registry-cleanup@trial.service
            state: started
          register: registry_unit
          failed_when: false

        # Finished oneshot unit: systemd has already forgotten it (no InvocationID);
        # journal since the start of this test (ansible_date_time: start of the play).
        - name: Journal of this run
          ansible.builtin.command:
            argv: [journalctl, -u, eupadev-registry-cleanup@trial.service, -o, cat, --no-pager, --since, "@{{ ansible_date_time.epoch }}"]
          register: registry_log
          changed_when: false

        - name: The unit succeeded and erased what the playbook listed
          vars:
            unit_output: "{{ registry_log.stdout_lines | select('match', '\\{') | first | default('{}') | from_json }}"
            versions: "{{ unit_output.packages[registry_package] | default({}) }}"
            expected: "{{ registry_playbook_sort.packages[registry_package] }}"
          ansible.builtin.assert:
            that:
              - unit_output.applied | default(false)
              - versions.erased | map(attribute='version') | sort == expected.erased | map(attribute='version') | sort
              - versions.kept | map(attribute='version') | sort == expected.kept | map(attribute='version') | sort
            success_msg: >-
              OK — timer's unit: same sort as the playbook
              ({{ versions.erased | length }} erased, {{ versions.kept | length }} kept)
            fail_msg: "FAILED — timer's unit: {{ registry_unit.msg | default('') }} — journal: {{ registry_log.stdout_lines }}"
            quiet: true

        - name: State of the weekly timer
          ansible.builtin.systemd_service:
            name: eupadev-registry-cleanup.timer
          register: registry_timer

        - name: Parameters of the weekly instance
          ansible.builtin.slurp:
            src: /etc/eupadev-registry-cleanup/registry.json
          register: registry_settings

        - name: Password of the unit
          ansible.builtin.stat:
            path: /etc/eupadev-registry-cleanup/password
          register: registry_password

        - name: Timer active, parameters up to date, password root only
          vars:
            timer_state: "{{ registry_timer.status }}"
            settings: "{{ registry_settings.content | b64decode | from_json }}"
          ansible.builtin.assert:
            that:
              - timer_state.ActiveState == 'active'
              - timer_state.UnitFileState == 'enabled'
              - timer_state.Unit == 'eupadev-registry-cleanup@registry.service'
              - settings.in_service == registry_in_service
              - settings.movable_tags == registry_movable
              - settings.apply
              - "'password' not in settings"
              - registry_password.stat.pw_name == 'root'
              - registry_password.stat.mode == '0600'
            success_msg: "OK — timer active (next run {{ timer_state.NextElapseUSecRealtime }}), parameters == group_vars, password 0600 root"
            fail_msg: >-
              FAILED — timer: {{ timer_state.ActiveState }} / {{ timer_state.UnitFileState }} / {{ timer_state.Unit }},
              parameters {{ settings }}, password {{ registry_password.stat.mode | default('missing') }}
            quiet: true

        - name: Read the versions left in the trial package
          ansible.builtin.uri:
            url: "{{ gitea_api }}/packages/{{ gitea_org }}?type=container&q={{ registry_package }}&limit=50"
          register: registry_remaining

        - name: The last 3 builds and the one in service remain, signatures and manifests included
          vars:
            builds: "{{ registry_trial.stdout | from_json }}"
            # Each build: tag, signature, image, attestation, bundle.
            expected: "{{ builds | rejectattr('tag', 'equalto', 'trial-2') | map(attribute='versions') | flatten }}"
            actual: "{{ registry_remaining.json | selectattr('name', 'equalto', registry_package) | map(attribute='version') | list }}"
          ansible.builtin.assert:
            that:
              - builds | length == 5
              - actual | length == 20
              - actual | sort == expected | sort
            success_msg: "OK — cleanup: trial-1 (in service), trial-3 to 5 kept with their signatures; trial-2 erased ({{ actual | length }} versions)"
            fail_msg: >-
              FAILED — cleanup: extra {{ actual | difference(expected) }}, missing {{ expected | difference(actual) }}
            quiet: true

      always:
        - name: Delete the temporary tokens
          ansible.builtin.uri:
            url: "{{ gitea_api }}/users/{{ item }}/tokens/{{ token_name }}"
            method: DELETE
            status_code: [204, 404]
          loop: [svc-agent, svc-orchestrator, ilan]

        # Had a forbidden push been accepted, it must leave nothing in the platform.
        # Gitea refuses to delete a branch covered by a protection
        # (protected template) even if it does not exist: read first.
        - name: Possible trial branches in the platform repositories
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ item.repo }}/branches/{{ item.branch | urlencode }}"
            status_code: [200, 404]
          loop: "{{ push_tests | selectattr('repo', 'defined') }}"
          loop_control: { label: "{{ item.repo }} {{ item.branch }}" }
          register: trial_branches

        - name: Delete the trial branches found
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ item.item.repo }}/branches/{{ item.item.branch | urlencode }}"
            method: DELETE
            status_code: 204
          loop: "{{ trial_branches.results | selectattr('status', 'equalto', 200) }}"
          loop_control: { label: "{{ item.item.repo }} {{ item.item.branch }}" }

        - name: Delete the trial repository and the generated tool
          ansible.builtin.uri:
            url: "{{ gitea_api }}/repos/{{ gitea_org }}/{{ item }}"
            method: DELETE
            status_code: [204, 404]
          loop: ["{{ repo }}", "{{ repo }}-generated", "{{ repo }}-orch"]

        # The pipeline of a generated tool publishes its image under the repository's name:
        # with the repository deleted, the package would remain.
        - name: Delete the images published by the trial tools
          ansible.builtin.uri:
            url: "{{ gitea_api }}/packages/{{ gitea_org }}/container/{{ item }}"
            method: DELETE
            status_code: [204, 404]
          loop: ["{{ repo }}", "{{ repo }}-generated", "{{ repo }}-orch"]

        - name: Delete the local copies
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: ["{{ workdir }}", "{{ workdir }}-orch"]

        - name: Delete the registry's trial package
          ansible.builtin.uri:
            url: "{{ gitea_api }}/packages/{{ gitea_org }}/container/{{ registry_package }}"
            method: DELETE
            status_code: [204, 404]

        - name: Remove the unit's trial instance
          ansible.builtin.file:
            path: /etc/eupadev-registry-cleanup/trial.json
            state: absent

        - name: Forget a failure of the trial instance (systemctl --failed)
          ansible.builtin.command: systemctl reset-failed eupadev-registry-cleanup@trial.service
          changed_when: false
          failed_when: false
