# Ansible settings of the lab. Nothing secret here: the SSH key and the vault
# password (Ansible Vault) stay outside the repository, on the administrator's
# machine.
[defaults]
inventory = inventory/lab.yml
remote_user = ansible
private_key_file = ~/.ssh/eupadev_lab
vault_password_file = ~/.eupadev-vault-pass
interpreter_python = auto_silent
# Pinned collections of requirements.yml only (never the system ones).
collections_path = ./.ansible/collections

[ssh_connection]
# Accepts a VM's key the first time, then refuses it if it changes (which
# would signal a substituted machine).
# Fingerprint file reserved for the lab: the VMs are recreated often there
# (new fingerprint each time); empty it after a recreation.
ssh_args = -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.eupadev-known-hosts
pipelining = True
