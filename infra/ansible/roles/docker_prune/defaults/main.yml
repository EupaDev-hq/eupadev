# Every hour (systemd OnCalendar): cheap when there is nothing old to prune. A
# pipeline running at that time loses nothing: its images and its build cache
# are in use.
docker_prune_hour: "hourly"
# Age under which nothing is pruned (Docker `until` filter, counted from the
# build or the pull): an unused image or cache younger than this stays — a
# Preview about to be deployed, a cache a branch reuses.
docker_prune_age: 72h
# Disk use (percent of /var/lib/docker) from which the age drops to
# docker_prune_pressure_age: the cache of the last hours goes before a build
# fails for want of space.
docker_prune_pressure: 80
docker_prune_pressure_age: 6h
