# Daily slot (systemd OnCalendar, UTC): 01:00, before the CI VM's maintenance
# reboot (03:30) and the Monday golden images (04:00). A pipeline running at
# that hour loses nothing: its images and its build cache are in use.
docker_prune_hour: "*-*-* 01:00:00 UTC"
# Age under which nothing is pruned (Docker `until` filter, counted from the
# build or the pull): an unused image or cache younger than this stays — a
# Preview about to be deployed, a cache a branch reuses.
docker_prune_age: 72h
