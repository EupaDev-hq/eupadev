# Role deployer (ADR-014): Caddy of the target (E5a) and the engine's access (E5b).

# Environments served by the VM (group_vars of ci and tools): Caddy has a
# block for them only, the script refuses all the others.
deployer_envs: []

# End-user texts of the mock-up frame page (lang/<language>.json of this role), in the
# platform language (eupadev_language, group_vars/all).
deployer_language: "{{ eupadev_language | default('en') }}"
deployer_texts: "{{ lookup('ansible.builtin.file', role_path ~ '/lang/' ~ deployer_language ~ '.json') | from_json }}"

# Account that receives the engine's SSH key: outside the docker group, a
# single sudo rule to the script.
deployer_user: deployment

# Only address the key is accepted from (from=): the orchestrator VM.
deployer_engine_ip: "{{ hostvars[groups['orchestrator'][0]].ansible_host }}"

# A tool name becomes a DNS label and a container name: bounded length
# (margin under 63 for "preview-" and the suffixes) and the platform's names
# refused (otherwise a tool "git" would take the forge's address, a tool
# "chat" the requesters' page, chat_domain).
deployer_slug_max: 40
deployer_reserved_names: [git, mockup, preview, www, docs, api, auth, chat, keycloak, gatus, ntfy, mail, admin]

# E5c: cosign, which verifies the signature of the tool images (E5d): same
# version and checksum as roles/orchestrator/defaults/main.yml (binary
# cosign-linux-amd64 of the release published on GitHub).
deployer_cosign_version: v3.1.3
deployer_cosign_sha256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71

# Public signing key of the TOOLS (never the engine's nor the agents'),
# written by init-vault.sh and committed; put on the target as
# /etc/eupadev/cosign-tools.pub, which the script reads (E5d).
deployer_cosign_tools_pub: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/cosign-tools.pub') }}"

# E5d: Previews per VM (CI VM of 4 GiB shared with the runners, 256 MiB per
# Preview in the Compose model); beyond, the deployer refuses with the reason.
deployer_preview_quota: 3

# d5 (core tools): the identity provider the tools reach through the VM's
# Smokescreen (S6), its private address:port allowed explicitly (Smokescreen
# refuses private ranges otherwise), and the OIDC issuer of realm tools.
deployer_idp_host: "auth.{{ base_domain }}"
deployer_idp_address: "{{ hostvars[groups['orchestrator'][0]].ansible_host }}:443"
deployer_oidc_issuer: "https://{{ deployer_idp_host }}/realms/tools"
# S7: daily purge of the core tools, Prod VM only (UTC; after the 02:30
# backups of the other VMs).
deployer_purge_hour: "*-*-* 03:30:00 UTC"
