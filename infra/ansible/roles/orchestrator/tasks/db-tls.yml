# PostgreSQL of the orchestrator over verified TLS (CIS PostgreSQL §5.4, §6.8):
#   - server certificate signed by the database authority (db_pki role),
#     names "db" (Compose services) and IP of the VM (executor);
#   - our own pg_hba (the image's accepts clear text): TLS 1.3 required
#     outside the local socket, scram-sha-256, and a client certificate
#     required from the agents VM (clientcert=verify-full, CN = PostgreSQL role);
#   - port published on the VM's IP, filtered in DOCKER-USER (Docker bypasses
#     ufw): only the agents VM reaches it.
- name: Server certificate of the database
  ansible.builtin.include_role:
    name: db_pki
  vars:
    db_pki_dir: /opt/eupadev/orchestrator/tls
    db_pki_name: server
    db_pki_cn: db
    db_pki_san: ["DNS:db", "IP:{{ ansible_host }}"]
    db_pki_usage: serverAuth
    db_pki_uid: 70

- name: Access rules of PostgreSQL (pg_hba)
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /opt/eupadev/orchestrator/tls/pg_hba.conf
    owner: "70"
    group: "70"
    mode: "0644"
  register: orchestrator_hba

- name: Remember whether PostgreSQL must reread its certificate and rules
  ansible.builtin.set_fact:
    orchestrator_db_reread: "{{ db_pki_change or orchestrator_hba.changed }}"

# Docker publishes its ports bypassing ufw (Docker documentation, "Packet
# filtering and firewalls"): the filter goes into the DOCKER-USER chain, which
# Docker never flushes. Installed BEFORE Docker (chain created by us, taken
# over by Docker): no window where the port is open to everyone at boot.
- name: Filter of the database port (DOCKER-USER)
  ansible.builtin.template:
    src: eupadev-db-firewall.service.j2
    dest: /etc/systemd/system/eupadev-db-firewall.service
    mode: "0644"
  register: orchestrator_firewall_unit

- name: Enable the filter of the database port
  ansible.builtin.systemd_service:
    name: eupadev-db-firewall.service
    enabled: true
    daemon_reload: "{{ orchestrator_firewall_unit.changed }}"
    state: "{{ 'restarted' if orchestrator_firewall_unit.changed else 'started' }}"
