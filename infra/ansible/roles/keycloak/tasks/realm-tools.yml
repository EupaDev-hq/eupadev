# Realm tools as code (R8), through its own configuration client (D5).
# Everything comes from keycloak_tools_realm (the import file of the core's
# CI) except the secrets and the tool addresses (group_vars). Ansible removes
# nothing: verify-keycloak.yml compares the realm with that file.
- name: Realm tools through the configuration client
  vars:
    r: "{{ keycloak_tools_realm }}"
  module_defaults:
    group/community.general.keycloak:
      auth_keycloak_url: "{{ keycloak_admin_url }}"
      auth_realm: tools
      auth_client_id: tools-config
      auth_client_secret: "{{ vault_keycloak_tools_config_secret }}"
  block:
    # Same values as eupadev (D8, D11, D13), read from the file.
    - name: Settings of the realm tools
      community.general.keycloak_realm:
        realm: tools
        id: tools
        enabled: "{{ r.enabled }}"
        ssl_required: "{{ r.sslRequired }}"
        registration_allowed: "{{ r.registrationAllowed }}"
        reset_password_allowed: "{{ r.resetPasswordAllowed }}"
        remember_me: "{{ r.rememberMe }}"
        access_token_lifespan: "{{ r.accessTokenLifespan }}"
        sso_session_idle_timeout: "{{ r.ssoSessionIdleTimeout }}"
        sso_session_max_lifespan: "{{ r.ssoSessionMaxLifespan }}"
        revoke_refresh_token: "{{ r.revokeRefreshToken }}"
        refresh_token_max_reuse: "{{ r.refreshTokenMaxReuse }}"
        events_enabled: "{{ r.eventsEnabled }}"
        events_expiration: "{{ r.eventsExpiration }}"
        events_listeners: "{{ r.eventsListeners }}"
        admin_events_enabled: "{{ r.adminEventsEnabled }}"
        admin_events_details_enabled: "{{ r.adminEventsDetailsEnabled }}"
        attributes: "{{ r.attributes }}"
        brute_force_protected: "{{ r.bruteForceProtected }}"
        permanent_lockout: "{{ r.permanentLockout }}"
        max_temporary_lockouts: "{{ r.maxTemporaryLockouts }}"
        failure_factor: "{{ r.failureFactor }}"
        wait_increment_seconds: "{{ r.waitIncrementSeconds }}"
        max_failure_wait_seconds: "{{ r.maxFailureWaitSeconds }}"
        minimum_quick_login_wait_seconds: "{{ r.minimumQuickLoginWaitSeconds }}"
        state: present

    # keycloak_realm ignores defaultOptionalClientScopes (see realm.yml).
    - name: Token of the configuration client of the realm tools
      ansible.builtin.uri:
        url: "{{ keycloak_admin_url }}/realms/tools/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: tools-config
          client_secret: "{{ vault_keycloak_tools_config_secret }}"
      register: keycloak_tools_cfg
      no_log: true

    - name: Default optional scopes of the realm tools
      ansible.builtin.uri:
        url: "{{ keycloak_admin_url }}/admin/realms/tools/default-optional-client-scopes"
        headers: { Authorization: "Bearer {{ keycloak_tools_cfg.json.access_token }}" }
      register: keycloak_tools_opt_scopes
      no_log: true

    - name: Remove from the default optional scopes what the file does not put there (offline_access)
      ansible.builtin.uri:
        url: "{{ keycloak_admin_url }}/admin/realms/tools/default-optional-client-scopes/{{ item.id }}"
        method: DELETE
        headers: { Authorization: "Bearer {{ keycloak_tools_cfg.json.access_token }}" }
        status_code: 204
      loop: "{{ keycloak_tools_opt_scopes.json | rejectattr('name', 'in', r.defaultOptionalClientScopes) }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      no_log: true

    # Clients of the tools: secret generated by Keycloak at creation (never
    # the file's, which belongs to the CI); origin of the addresses replaced by
    # the tool's on the lab.
    - name: Clients of the tools
      community.general.keycloak_client:
        realm: tools
        client_id: "{{ item.clientId }}"
        description: "{{ item.description }}"
        enabled: "{{ item.enabled }}"
        public_client: "{{ item.publicClient }}"
        client_authenticator_type: "{{ item.clientAuthenticatorType }}"
        standard_flow_enabled: "{{ item.standardFlowEnabled }}"
        implicit_flow_enabled: "{{ item.implicitFlowEnabled }}"
        direct_access_grants_enabled: "{{ item.directAccessGrantsEnabled }}"
        service_accounts_enabled: "{{ item.serviceAccountsEnabled }}"
        full_scope_allowed: "{{ item.fullScopeAllowed }}"
        frontchannel_logout: "{{ item.frontchannelLogout }}"
        redirect_uris: "{{ item.redirectUris | map('regex_replace', '^https?://[^/]+', address) | list }}"
        web_origins: "{{ item.webOrigins }}"
        attributes: >-
          {{ item.attributes | combine({
               'post.logout.redirect.uris': item.attributes['post.logout.redirect.uris'] | regex_replace('^https?://[^/]+', address),
               'backchannel.logout.url': item.attributes['backchannel.logout.url'] | regex_replace('^https?://[^/]+', address)}) }}
        client_scopes_behavior: idempotent
        default_client_scopes: "{{ item.defaultClientScopes }}"
        optional_client_scopes: "{{ item.optionalClientScopes }}"
        protocol_mappers: "{{ item.protocolMappers }}"
      vars:
        address: "{{ keycloak_tool_addresses[item.clientId] }}"
      loop: "{{ r.clients }}"
      loop_control:
        label: "{{ item.clientId }}"

    # Clients created by Keycloak with full scope (and direct password for
    # admin-cli): turned off as in eupadev (D4, D8).
    - name: Clients created by Keycloak, full scope and direct password off
      community.general.keycloak_client:
        realm: tools
        client_id: "{{ item }}"
        full_scope_allowed: false
        direct_access_grants_enabled: false
        implicit_flow_enabled: false
      loop: [admin-cli, security-admin-console]

    - name: Roles of the tools' clients
      community.general.keycloak_role:
        realm: tools
        client_id: "{{ item.0.key }}"
        name: "{{ item.1.name }}"
        description: "{{ item.1.description }}"
      loop: "{{ r.roles.client | dict2items | subelements('value') }}"
      loop_control:
        label: "{{ item.0.key }}/{{ item.1.name }}"

    - name: Groups that carry the roles (D4)
      community.general.keycloak_group:
        realm: tools
        name: "{{ item.name }}"
      loop: "{{ r.groups }}"
      loop_control:
        label: "{{ item.name }}"

    # ponytail: one client per group (the file's case); verify-keycloak.yml checks it.
    - name: Roles of each group
      community.general.keycloak_client_rolemapping:
        realm: tools
        group_name: "{{ item.name }}"
        client_id: "{{ item.clientRoles | list | first }}"
        roles: "{{ item.clientRoles[item.clientRoles | list | first] | map('community.general.dict_kv', 'name') | list }}"
      loop: "{{ r.groups }}"
      loop_control:
        label: "{{ item.name }}"

    # Test people, without password: no sign-in possible outside
    # verify-keycloak.yml (throwaway password, removed at the end).
    - name: Test people (without password)
      community.general.keycloak_user:
        realm: tools
        username: "{{ item.username }}"
        first_name: "{{ item.firstName }}"
        last_name: "{{ item.lastName }}"
        email: "{{ item.email }}"
        email_verified: "{{ item.emailVerified }}"
        enabled: "{{ item.enabled }}"
        groups: "{{ item.groups | map('regex_replace', '^/', '') | map('community.general.dict_kv', 'name') | list }}"
      loop: "{{ r.users }}"
      loop_control:
        label: "{{ item.username }}"
