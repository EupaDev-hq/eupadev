# Agents VM: the DBOS executor (note docs/reflexions/2026-10-15-note-lanceur-service.md).
# Same image as the pilot (orchestrator VM), same digest, role
# EUPADEV_ROLE=executor: it takes only the agent-tasks queue (W2), has
# neither API, nor watcher, nor monitoring, and launches the agent containers
# through the VM's Docker socket (gVisor required by the engine for each agent).
# ONE replica only: the database refuses a second executor (lock per role).
#
# Database: the orchestrator's, over verified TLS 1.3 with a client
# certificate (tls/, executor role). Forge: https, lab authority taken from
# the VM's authorities (lab_ca), name set in extra_hosts.
# Secrets (eupadev-secrets.service, systemd-creds, uid 1000): database URL,
# svc-agent token, core read badge, registry login (docker and cosign).
# Variables: .env put in place by Ansible (executor role).
name: executor

services:
  executor:
    image: ${ORCHESTRATOR_IMAGE:?missing}
    pull_policy: never
    restart: unless-stopped
    environment:
      EUPADEV_ROLE: ${EUPADEV_ROLE:?missing}
      EUPADEV_EXTERNAL: ${EUPADEV_EXTERNAL:-fake-auto}
      ORCH_DATABASE_URL_FILE: /run/secrets/executor_database_url
      ADMIN_ESCALATION_ADDRESS: ${ADMIN_ESCALATION_ADDRESS:-}
      TOOL_DOMAIN: ${TOOL_DOMAIN:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      AGENT_CONCURRENCY: ${AGENT_CONCURRENCY:-1}
      FORGE_URL: ${FORGE_URL:-}
      AGENT_FORGE_TOKEN_FILE: /run/secrets/executor_forge_token
      # Same svc-agent token for the pushing fake (engine=pushing, free cycle).
      AGENT_TOKEN_FILE: /run/secrets/executor_forge_token
      AGENT_IMAGE: ${AGENT_IMAGE:-}
      AGENT_COSIGN_PUB: /etc/eupadev/cosign.pub
      AGENT_AI_PROXY: ${AGENT_AI_PROXY:-}
      AGENT_EGRESS_PROXY: ${AGENT_EGRESS_PROXY:-}
      AGENT_PROXIES: ${AGENT_PROXIES:-}
      # Core store (ADR-023): read badge handed to the fetch container only.
      AGENT_CORE_REGISTRY: ${AGENT_CORE_REGISTRY:-}
      AGENT_CORE_TOKEN_FILE: /run/secrets/executor_core_token
      AGENT_CORE_HOST: ${AGENT_CORE_HOST:-}
      AGENT_CORE_CA: ${AGENT_CORE_CA:-}
      # docker and cosign read the registry login here (mounted secret).
      DOCKER_CONFIG: /run/secrets/docker
      # Node (fetch to the forge): authorities of the VM, lab authority included.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
      # Read-only root: git, docker and cosign write their caches in memory.
      HOME: /tmp
    # Emergency stop level 1 (emergency-stop.yml): PAUSE_AGENTS=1, put in this
    # separate file so that a pass of Ansible does not lift the pause.
    env_file:
      - path: pause-agents.conf
        required: false
    secrets:
      - executor_database_url
      - executor_forge_token
      - executor_core_token
      - source: executor_docker_config
        target: /run/secrets/docker/config.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tls:/tls:ro
      - ./cosign.pub:/etc/eupadev/cosign.pub:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    group_add: ["${DOCKER_GID:?missing}"]
    extra_hosts: ["${FORGE_HOST:?missing}:${FORGE_IP:?missing}"]
    # Git clones and throwaway bundles in /tmp (memory); nothing else is written.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    # No API: the health is the process's (code 1 when it loses its database
    # or its lock; Docker restarts it).
    healthcheck:
      disable: true
    # Time for DBOS.shutdown (the running tasks resume at the restart).
    stop_grace_period: 60s

secrets:
  executor_database_url:
    file: ${SECRETS_DIR:-/run/eupadev/secrets}/executor_database_url
  executor_forge_token:
    file: ${SECRETS_DIR:-/run/eupadev/secrets}/executor_forge_token
  executor_core_token:
    file: ${SECRETS_DIR:-/run/eupadev/secrets}/executor_core_token
  executor_docker_config:
    file: ${SECRETS_DIR:-/run/eupadev/secrets}/executor_docker_config
