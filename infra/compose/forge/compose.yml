# The forge: three services in the same file.
#   db     — PostgreSQL, Gitea's database (never exposed).
#   gitea  — the code store (never exposed directly).
#   caddy  — the only entry point, over HTTPS (ports 80/443).
#
# The whole configuration comes from the variables of the .env file set next
# to it by Ansible (never committed): the same file serves the lab and production.
# Pinned versions: an upgrade is a deliberate change.
name: forge

services:
  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:?missing}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gitea", "-d", "gitea"]
      interval: 10s
      retries: 6
    mem_limit: 512m

  gitea:
    image: gitea/gitea:28.1.0-rootless@sha256:b1a90409ae9afcd5a5725404c3639da7245248848b99e35332968891290b953e
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:?missing}
      # Gitea 28 no longer reads [server] DOMAIN: the domain comes from ROOT_URL.
      GITEA__server__ROOT_URL: https://${GITEA_DOMAIN:?missing}/
      # Git access only over HTTPS with a token: no SSH server.
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__START_SSH_SERVER: "false"
      # Web installer locked: everything is configured here and by Ansible.
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY:?missing}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN:?missing}
      GITEA__oauth2__JWT_SECRET: ${GITEA_JWT_SECRET:?missing}
      # Gitea 28: no outgoing network traffic (webhooks, OAuth2 clients, migrations,
      # mirrors) without an allowed address; empty list as long as none is needed.
      GITEA__security__EGRESS_MODE: strict
      GITEA__migrations__EGRESS_MODE: strict
      # Audit log (Gitea 28): branch protections, tokens, teams, secrets,
      # failed sign-ins — the trace that a gate was not quietly weakened.
      # Kept 400 days (Ilan's decision, 2026-10-12).
      GITEA__audit__RECORD_OUTPUT: database
      GITEA__audit__RETENTION_DAYS: "400"
      # Closed forge: no open registration, sign-in required even to read.
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      # Image registry (promotion by digest) and CI.
      GITEA__packages__ENABLED: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__actions__DEFAULT_ACTIONS_URL: github
    # Service door for Ansible (administration API), reachable only from
    # the VM itself — never from the network.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 15s
      retries: 8
    mem_limit: 1g

  # Image by digest: the platform's Caddy with the OVH DNS module (caddy_image,
  # pulled and signature-verified by Ansible) or the official one (first pass).
  # Caddyfile written by Ansible (role gitea); OVH credentials for Let's
  # Encrypt DNS-01 in its environment, from .env (empty with tls internal).
  caddy:
    image: ${CADDY_IMAGE:?missing}
    restart: unless-stopped
    depends_on: [gitea]
    ports:
      - "80:80"
      - "443:443"
    environment:
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY:-}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET:-}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    mem_limit: 128m

volumes:
  db:
  gitea-data:
  gitea-config:
  caddy-data:
