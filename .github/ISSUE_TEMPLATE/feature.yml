name: Feature request
description: An idea or a need EupaDev does not cover yet.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: The need
      description: Who needs it and why — the problem first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: checkboxes
    id: roadmap
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and ROADMAP.md.
          required: true
