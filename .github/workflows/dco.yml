# Developer Certificate of Origin (CONTRIBUTING.md): every commit of a pull
# request is signed off by its author (.github/scripts/check-dco.py).
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The check itself works
        run: python3 .github/scripts/check-dco.py --self-test

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check-dco.py "$BASE" "$HEAD"
