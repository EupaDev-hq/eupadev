# The installation script without Docker Compose: shellcheck, syntax,
# argument parsing, loopback refusal, a prerequisites check that creates
# nothing, the variable contract with the discovery Compose file (ADR-028).
# The real install, smoke checks, re-run and uninstall of discovery mode:
# install.yml.
name: Installation script

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  script:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Official shellcheck release, checked by its sha256 sum (same way as
      # cosign in release.yml: a tag can move, a checksum cannot).
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned shellcheck
        run: |
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-$SHELLCHECK_VERSION/shellcheck"
      - name: shellcheck of the installer, its tests and the discovery init script
        run: '"$RUNNER_TEMP/shellcheck" install.sh tests/install/install.test.sh tests/install/discovery-smoke.sh infra/compose/discovery/init-roles.sh'
      - name: Syntax, arguments, refusals, check without Docker, Compose contract
        run: sh tests/install/install.test.sh
