# Engine image of the discovery mode (ADR-028): built from a release tag,
# pushed to GHCR by digest and signed keyless with cosign (identity = this
# workflow at this tag, GitHub's token service as certificate issuer, public
# transparency log). The installer verifies that signature before running
# the image. On a `v*` tag only, never on a push: a release is a decision.
# Enterprise installations build and sign their own image with their own
# key on their own forge (images/engine/.gitea/workflows/publish.yml); this
# workflow serves the discovery mode only.
name: Release — engine image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    # The public repository only: the private copy has no package to publish and must not sign anything.
    if: github.repository == 'EupaDev-hq/eupadev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      ENGINE_IMAGE: ghcr.io/eupadev-hq/eupadev-engine
      # Official cosign binary, checked by its sha256 sum (cosign_checksums.txt
      # of the version published on GitHub); same version as the forge and
      # as engine.yml.
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Context = repository root (the reports' schema lives outside
      # orchestrator/), filtered by orchestrator/Dockerfile.dockerignore.
      # --no-cache: the Dockerfile's Debian update is redone on every build.
      - name: Build the image
        run: docker build --pull --no-cache -f orchestrator/Dockerfile -t "$ENGINE_IMAGE:$GITHUB_REF_NAME" .

      # Tag = release tag (trace); the digest is the only reference signed
      # and the only one the discovery Compose file uses.
      - name: Push by digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push -q "$ENGINE_IMAGE:$GITHUB_REF_NAME"
          REF="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ENGINE_IMAGE:$GITHUB_REF_NAME" | grep "^$ENGINE_IMAGE@sha256:")"
          echo "REF=$REF" >> "$GITHUB_ENV"

      - name: Pinned cosign
        run: |
          curl -fsSLo "$RUNNER_TEMP/cosign" "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"

      # Keyless: cosign takes the job's OIDC token (id-token: write), Fulcio
      # issues a short-lived certificate naming this workflow at this tag,
      # the signature is recorded in the public log. Verified at once with
      # the identity the installer will require.
      - name: Sign the image keyless and verify
        run: |
          "$RUNNER_TEMP/cosign" sign --yes "$REF"
          "$RUNNER_TEMP/cosign" verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-engine-image.yml@$GITHUB_REF" \
            "$REF" > /dev/null
          echo "OK: signature checked with the workflow identity."
          echo "Engine digest: $REF"

      - name: Clean up
        if: always()
        run: |
          docker logout ghcr.io > /dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/cosign"
