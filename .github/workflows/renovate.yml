# Self-hosted Renovate (Ilan's decision, 2026-10-13): run here, by a GitHub
# App dedicated to this repository alone, so that no third party reads the
# private code. Configuration: renovate.json (root). PRs are never merged
# automatically. Note: docs/reflexions/2026-10-13-note-suivi-versions.md.
#
# Prerequisites (once, by Ilan): the GitHub App, its variable RENOVATE_APP_ID
# and its secret RENOVATE_APP_PRIVATE_KEY — procedure in the note above.
name: Renovate

on:
  schedule:
    - cron: "17 4 * * *"  # every day; groups and delays are in renovate.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Short-lived token (1 h) of the GitHub App, limited to this repository.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.token.outputs.token }}
          renovate-version: 44.155.2@sha256:93e8dc64410276bb44854b4f6fce2306f8fe24c87301d558a920381130b30851
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
