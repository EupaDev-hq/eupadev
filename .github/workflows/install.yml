# The real discovery installation (ADR-028 "Verification", readiness note
# B7): on a runner with Docker, the engine image is built from the tree, then
# install.sh refuses a public address, installs discovery mode from the
# checkout, the installation answers (notice, Mailpit, both sign-ins, one
# whole cycle driven through the API up to the tool "in production":
# tests/install/discovery-smoke.sh), a second run changes nothing, and
# uninstall leaves no container, volume,
# network or file behind. The script without Docker: install-script.yml.
name: Installation (discovery mode)

on:
  push:
  pull_request:
  # Run by hand: also takes the README screenshots (artifact "screenshots").
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    # The engine image builds cosign from source (orchestrator/Dockerfile): the
    # build takes most of the time.
    timeout-minutes: 30
    env:
      # Same pinned cosign as release.yml (install.sh check requires it).
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pinned cosign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/cosign" "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Built here rather than by install.sh, so that a build failure and an
      # installation failure are two different red steps.
      - name: Engine image of this tree
        run: docker build -f orchestrator/Dockerfile -t eupadev-engine:discovery .

      - name: A public address is refused before anything runs
        run: |
          if sh install.sh discovery --address 0.0.0.0; then echo "0.0.0.0 was accepted"; exit 1; fi
          test ! -e "$HOME/.eupadev"

      - name: Prerequisites
        run: sh install.sh check

      # The two generated passwords are shown once on the terminal (ADR-028):
      # kept out of the job log, read back from the owner-only file by the
      # smoke checks.
      - name: Install
        run: |
          set +e; sh install.sh discovery > "$RUNNER_TEMP/install.log" 2>&1; status=$?; set -e
          grep -v -E '^ +(requester|admin) +[0-9a-f]+$' "$RUNNER_TEMP/install.log"
          exit "$status"

      - name: The installation answers as documented
        run: sh tests/install/discovery-smoke.sh

      - name: A second run changes nothing
        run: |
          before="$(docker ps --filter name=eupadev-discovery --format '{{.Names}} {{.CreatedAt}}' | sort)"
          sh install.sh discovery > "$RUNNER_TEMP/rerun.log" 2>&1
          grep -v -E '^ +(requester|admin) +[0-9a-f]+$' "$RUNNER_TEMP/rerun.log"
          grep -q "nothing changed" "$RUNNER_TEMP/rerun.log"
          after="$(docker ps --filter name=eupadev-discovery --format '{{.Names}} {{.CreatedAt}}' | sort)"
          [ "$before" = "$after" ] || { echo "containers were recreated"; exit 1; }

      # By hand only: the README screenshots from this very installation
      # (tests/install/screenshots.mjs, dark theme), kept as an artifact to
      # copy into docs/assets/screenshots/ after a look.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 22.23.4
      - name: Screenshots of the README
        if: github.event_name == 'workflow_dispatch'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          (cd orchestrator && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium)
          node tests/install/screenshots.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: screenshots
          path: docs/assets/screenshots/

      - name: Uninstall leaves nothing
        run: |
          sh install.sh uninstall --yes
          test -z "$(docker ps -a --filter name=eupadev-discovery -q)"
          test -z "$(docker volume ls -q | grep eupadev-discovery || true)"
          test -z "$(docker network ls --format '{{.Name}}' | grep eupadev-discovery || true)"
          test ! -e "$HOME/.eupadev/discovery"

      - name: Container logs
        if: failure()
        run: |
          for c in $(docker ps -a --filter name=eupadev-discovery --format '{{.Names}}'); do echo "=== $c"; docker logs "$c" 2>&1 | tail -n 80; done
