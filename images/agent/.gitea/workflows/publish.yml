# Builds, checks, publishes (by digest) and SIGNS the AI agents' image in
# the forge's registry (ROADMAP §8.11 n°21, §8.16, ADR-005, ADR-013).
# Claude Code is downloaded HERE, on the installation's forge, at a pinned
# and verified version (signature of Anthropic's manifest, see Dockerfile):
# EupaDev never publishes an image that contains it. Runs on every
# change of the `agent` repository (synced by Ansible from EupaDev),
# every Monday at 05:00 (after the golden image at 04:00: security fixes),
# or by hand. Models: repositories `engine` and `base-image`.
# The pipeline never runs the image beyond its checks: the launcher will
# name it by its digest, after verifying the signature.
name: Agent image

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  publish:
    # "image" runner: the only one with access to the CI VM's Docker.
    runs-on: ci-image
    timeout-minutes: 40
    env:
      # Official cosign binary, verified by its sha256 checksum (the one in
      # cosign_checksums.txt of the version published on GitHub).
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Golden image (organisation variable, tag) resolved ONCE to a digest,
      # then only the digest is used (ADR-005); it is written into the
      # image's OCI labels. Pulled with the read badge: the write badge only
      # serves the publication.
      - name: Build the image (from the golden image)
        env:
          REGISTRY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN }}
        run: |
          REG="${GITHUB_SERVER_URL#https://}"
          IMAGE="$(echo "$REG/${GITHUB_REPOSITORY%%/*}/agent" | tr '[:upper:]' '[:lower:]')"
          VERSION="$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' Dockerfile)"
          TAG="$VERSION-$(date -u +%Y%m%d)"
          { echo "REG=$REG"; echo "IMAGE=$IMAGE"; echo "VERSION=$VERSION"; echo "TAG=$TAG"; } >> "$GITHUB_ENV"
          echo "$REGISTRY_READ_TOKEN" | docker login "$REG" -u svc-deployment --password-stdin
          BASE="${{ vars.BASE_IMAGE_BUILD }}"
          docker pull -q "$BASE"
          BASE_REF="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$BASE" | grep "^${BASE%:*}@sha256:")"
          echo "Golden image: $BASE_REF"
          # --no-cache: Debian update and verified download of Claude Code
          # redone on every build.
          docker build -q --no-cache -t "$IMAGE:$TAG" \
            --build-arg BASE_IMAGE_BUILD="$BASE_REF" \
            --label org.opencontainers.image.base.name="$BASE" \
            --label org.opencontainers.image.base.digest="${BASE_REF#*@}" .

      - name: Known vulnerabilities (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE:$TAG"

      # The same promises are checked again on the agents VM, from the
      # published image (infra/ansible/verify-image-agent.yml).
      - name: Check the image's promises
        run: |
          USER_ID="$(docker run --rm "$IMAGE:$TAG" id -u)"
          test "$USER_ID" != 0
          echo "OK: the image runs as a non-root user (uid $USER_ID)."
          if docker run --rm "$IMAGE:$TAG" sh -c 'command -v docker || command -v sudo'; then
            echo "FAILED: docker or sudo present in the image."; exit 1
          fi
          echo "OK: neither docker nor sudo in the image."
          # --user 0: only root sees the whole file system (/root…).
          SUID="$(docker run --rm --user 0 "$IMAGE:$TAG" find / -xdev -type f -perm /6000)"
          if [ -n "$SUID" ]; then echo "FAILED: setuid/setgid files: $SUID"; exit 1; fi
          echo "OK: no setuid/setgid file in the image."
          test "$(docker run --rm "$IMAGE:$TAG" claude --version)" = "$VERSION (Claude Code)"
          echo "OK: claude --version = $VERSION (Claude Code), the pinned version."

      # Claude Code run with the engine's EXACT command line and the report
      # schema as the engine passes it (check/, generated from the engine),
      # WITHOUT network (free): a version that refuses an option, needs a
      # package or refuses the schema is stopped here, before it is
      # published. Inputs on standard input (the runner shares no path with
      # Docker).
      - name: Claude Code accepts the engine's options (no network)
        run: |
          tar -c -f - -C check . | docker run -i --rm --network=none --read-only --tmpfs=/tmp \
            --tmpfs=/home/agent:uid=10001,gid=10001 --cap-drop=ALL --security-opt=no-new-privileges --user=10001:10001 \
            -e ANTHROPIC_API_KEY=fake-key -e ANTHROPIC_BASE_URL=http://127.0.0.1:9 "$IMAGE:$TAG" \
            sh -c 'mkdir -p /tmp/task && tar -x -f - -C /tmp/task && sh /tmp/task/claude.sh'

      # Upstream trial (check/upstream-trial/, free): the image's Claude Code,
      # the engine's command line, in a TRAPPED clone, against a fake
      # Anthropic server on a Docker --internal network (no Internet, fake
      # key). Fails if the "attacker" of the trapped settings receives a
      # request, if a canary reaches the model, if a forbidden write goes
      # through or if normal work no longer does: a new Claude Code version
      # (Renovate PR) that changes behaviour is not published.
      # Passes with assertions only (the witnesses only serve the analysis).
      - name: Claude Code is not hijacked by a trapped repository (fake upstream)
        timeout-minutes: 10
        run: VARIANTS="code read reviewer" sh check/upstream-trial/launch.sh "$IMAGE:$TAG" "$RUNNER_TEMP/upstream-trial"

      # Tag = Claude Code version + date (trace); the digest is the only
      # reference used to sign and run.
      - name: Publish to the forge's registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login "$REG" -u svc-ci --password-stdin
          docker push -q "$IMAGE:$TAG"
          REF="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$TAG" | grep "^$IMAGE@sha256:")"
          echo "REF=$REF" >> "$GITHUB_ENV"

      # Signature with the installation's cosign key (secrets of the `agent`
      # repository, set by Ansible from the vault), without a public
      # transparency log or timestamp authority: the name and digest of an
      # internal image do not leave the forge. Public key: the
      # installation's, versioned next to the engine's image recipe in
      # EupaDev (same vault).
      - name: Sign the image (cosign)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          curl -fsSLo /tmp/cosign "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  /tmp/cosign" | sha256sum -c -
          chmod 0755 /tmp/cosign
          /tmp/cosign signing-config create --out /tmp/signing-config.json
          /tmp/cosign sign --yes --key env://COSIGN_PRIVATE_KEY --signing-config /tmp/signing-config.json "$REF"
          /tmp/cosign verify --key images/engine/cosign.pub --insecure-ignore-tlog=true "$REF" > /dev/null
          echo "OK: signature verified with the installation's public key."
          echo "Agent image digest: $REF"

      - name: Clean up
        if: always()
        run: |
          docker logout "$REG" > /dev/null 2>&1 || true
          docker rmi "$IMAGE:$TAG" > /dev/null 2>&1 || true
          rm -f /tmp/cosign /tmp/signing-config.json
