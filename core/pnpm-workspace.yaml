# pnpm settings of the core (ADR-019): no install
# script run (empty allowBuilds), versions published at least one day ago, no
# exotic dependency among the transitive ones.
packages: []
allowBuilds: {}
strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
# Security overrides of transitive dependencies (Dependabot, 2026-11-03):
# glob and minimatch come from node-pg-migrate, which still pins glob ~13.
overrides:
  glob: ^14.0.2
  minimatch: ^11.0.1
